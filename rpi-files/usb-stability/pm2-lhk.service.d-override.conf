# pm2-lhk 보강 (2026-10-06, 2026-10-07 개정)
#
# 2026-10-06: 기본 TimeoutStartSec=90 이 짧아 systemd 가 자기가 띄운 pm2 를 죽이는 루프가 됐다.
# 2026-10-07: 300초로 늘려도 **근본이 아니었다.** 원본 유닛이 Type=forking + PIDFile 인데
#   pm2 의 포크 방식과 맞지 않아 systemd 가 기동 완료를 인정하지 않는다:
#       "New main PID ... from PID file does not belong to service"
#   유닛이 영영 activating 에 머물고 → 타임아웃이 오면 또 죽인다. 90초가 300초가 됐을 뿐
#   같은 루프다. 게다가 가드(systemctl is-active)가 매분 재시작을 시도하게 된다.
#
# → pm2 데몬을 systemd 의 main PID 추적에서 떼어낸다.
#   Type=oneshot + RemainAfterExit=yes: resurrect 가 끝나면 유닛은 active(exited).
#   데몬이 죽는 경우는 smartfarm-pm2-guard.timer(60초)가 되살린다 — dump 의 앱이
#   목록에서 사라졌는지로 판정하므로 사람이 stop 한 것은 건드리지 않는다.
[Unit]
StartLimitIntervalSec=0
StartLimitBurst=0

[Service]
Type=oneshot
RemainAfterExit=yes
PIDFile=
TimeoutStartSec=300
TimeoutStopSec=60
