# pm2-lhk 보강 (2026-10-06)
#
# 왜: 기본 TimeoutStartSec=90 초가 앱 8개를 되살리는 `pm2 resurrect` 에 모자랐다.
#     systemd 가 "start operation timed out" 으로 **자기가 띄운 pm2 데몬을 죽이고**
#     다시 띄우기를 9번 반복했고, 그동안 제어기 전체(센서 수집·제어·CCTV)가 멎었다.
#     재시도 횟수 제한(StartLimitBurst)에 걸리면 그 뒤로는 아예 포기한다 — 그러면
#     사람이 올 때까지 농장이 멈춘다.
[Unit]
# 재시도 횟수 제한 해제 — 몇 번을 실패하든 계속 일어나려 한다
StartLimitIntervalSec=0
StartLimitBurst=0

[Service]
# resurrect 가 느려도 죽이지 않는다 (8개 앱 + 디스크 느릴 때 여유)
TimeoutStartSec=300
# 정지에도 여유 — 강제 종료로 상태 파일이 깨지지 않게
TimeoutStopSec=60
# 누가 `pm2 kill` 을 쳐도(오늘 실제로 있었다) 다시 올라온다.
# systemctl stop 으로 멈춘 경우에는 systemd 가 재시작하지 않으므로 정비는 그대로 가능하다.
Restart=always
RestartSec=10
