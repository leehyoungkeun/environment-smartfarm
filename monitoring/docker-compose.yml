services:
  glitchtip-postgres:
    image: postgres:15-alpine
    container_name: glitchtip-postgres
    environment:
      POSTGRES_PASSWORD: ${GT_DB_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-pg:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s

  glitchtip-redis:
    image: redis:7-alpine
    container_name: glitchtip-redis
    restart: unless-stopped
    networks:
      - monitoring

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-web
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${GT_DB_PASSWORD}@glitchtip-postgres/glitchtip
      SECRET_KEY: ${GT_SECRET}
      REDIS_URL: redis://glitchtip-redis/0
      DEFAULT_FROM_EMAIL: noreply@smartgreen.kr
      GLITCHTIP_DOMAIN: https://sentry.smartgreen.kr
      ENABLE_OPEN_USER_REGISTRATION: "false"
      EMAIL_URL: consolemail://
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - monitoring

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-worker
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://postgres:${GT_DB_PASSWORD}@glitchtip-postgres/glitchtip
      SECRET_KEY: ${GT_SECRET}
      REDIS_URL: redis://glitchtip-redis/0
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    environment:
      # 알림 메시지의 시각을 한국시간으로 표시 (템플릿의 .Local 이 이 TZ 를 따른다)
      TZ: Asia/Seoul
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      # Discord 웹훅 URL — 인증 수단이므로 설정과 분리해 git 에 넣지 않는다.
      - ./discord_webhook_url:/etc/alertmanager/discord_webhook_url:ro
      - alertmanager-data:/alertmanager
      # 컨테이너에 tzdata 가 없어 TZ 만으로는 KST 가 적용되지 않는다.
      # 호스트의 시간대 DB 를 읽기전용으로 마운트해야 템플릿의 .Local 이 한국시간이 된다.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.smartgreen.kr
      GF_SERVER_DOMAIN: grafana.smartgreen.kr
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  alertmanager-data:
  glitchtip-pg:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge