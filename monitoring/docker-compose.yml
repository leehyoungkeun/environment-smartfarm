services:
  glitchtip-postgres:
    image: postgres:15-alpine
    container_name: glitchtip-postgres
    environment:
      POSTGRES_PASSWORD: ${GT_DB_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-pg:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s

  glitchtip-redis:
    image: redis:7-alpine
    container_name: glitchtip-redis
    restart: unless-stopped
    networks:
      - monitoring

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-web
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${GT_DB_PASSWORD}@glitchtip-postgres/glitchtip
      SECRET_KEY: ${GT_SECRET}
      REDIS_URL: redis://glitchtip-redis/0
      DEFAULT_FROM_EMAIL: noreply@smartgreen.kr
      GLITCHTIP_DOMAIN: https://sentry.smartgreen.kr
      ENABLE_OPEN_USER_REGISTRATION: "false"
      EMAIL_URL: consolemail://
      # 업타임 체커가 사설 IP(도커 내부 172.18.x) 를 SSRF 보호로 막는다 (기본 false).
      # Prometheus·Alertmanager·Loki 는 localhost 전용이라 내부 이름으로만 감시할 수 있다.
      # 단일 사용자 자체 호스팅 — 모니터를 만드는 사람이 곧 운영자라 SSRF 위험이 없다. (2026-08-27)
      GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - monitoring

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-worker
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://postgres:${GT_DB_PASSWORD}@glitchtip-postgres/glitchtip
      SECRET_KEY: ${GT_SECRET}
      REDIS_URL: redis://glitchtip-redis/0
      # 업타임 체커가 사설 IP(도커 내부 172.18.x) 를 SSRF 보호로 막는다 (기본 false).
      # Prometheus·Alertmanager·Loki 는 localhost 전용이라 내부 이름으로만 감시할 수 있다.
      # 단일 사용자 자체 호스팅 — 모니터를 만드는 사람이 곧 운영자라 SSRF 위험이 없다. (2026-08-27)
      GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS: "true"
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    environment:
      # 알림 메시지의 시각을 한국시간으로 표시 (템플릿의 .Local 이 이 TZ 를 따른다)
      TZ: Asia/Seoul
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      # Discord 웹훅 URL — 인증 수단이므로 설정과 분리해 git 에 넣지 않는다.
      - ./discord_webhook_url:/etc/alertmanager/discord_webhook_url:ro
      # dead man's switch — GlitchTip Heartbeat URL (git 제외, 644 여야 alertmanager(nobody) 가 읽는다)
      - ./heartbeat_url:/etc/alertmanager/heartbeat_url:ro
      - alertmanager-data:/alertmanager
      # 컨테이너에 tzdata 가 없어 TZ 만으로는 KST 가 적용되지 않는다.
      # 호스트의 시간대 DB 를 읽기전용으로 마운트해야 템플릿의 .Local 이 한국시간이 된다.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - -config.file=/etc/loki/local-config.yaml
      # 기본 4MB/s 로는 백엔드·도커 로그 유입을 감당 못해 429 가 난다.
      # (promtail 최초 기동 시 기존 파일을 따라잡는 구간에서 특히)
      - -distributor.ingestion-rate-limit-mb=32
      - -distributor.ingestion-burst-size-mb=64
      # 보존 정책 — 없으면 무한 증가한다 (2026-08-26 하루 만에 3.5GB)
      - -table-manager.retention-period=720h
      - -table-manager.retention-deletes-enabled=true
      - -compactor.retention-enabled=true
      - -compactor.working-directory=/loki/compactor
      # retention 활성화 시 필수 (없으면 CONFIG ERROR 로 기동 실패)
      - -compactor.delete-request-store=filesystem
    ports:
      - "127.0.0.1:3100:3100"
      # RPi 가 Tailscale 로 로그를 푸시할 수 있게 테일넷 주소에만 추가 노출.
      # 공인망에는 열리지 않는다 (Tailscale 인터페이스 한정).
      - "100.71.181.121:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - promtail-positions:/tmp
      # 백엔드 PM2 로그 (읽기전용)
      - /home/afocus/smartfarm/logs:/var/log/smartfarm:ro
      # 도커 컨테이너 로그 (읽기전용)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.smartgreen.kr
      GF_SERVER_DOMAIN: grafana.smartgreen.kr
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      # afocus 프로브(백업 등)가 쓰는 텍스트파일 지표 — ./textfile/*.prom
      - '--collector.textfile.directory=/textfile'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      - './textfile:/textfile:ro'
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - monitoring

  # ── cAdvisor — 컨테이너별 상태·CPU·메모리 (2026-08-28) ──
  # 그전까지 Prometheus 는 컨테이너 4개(자기 자신들)만 HTTP 로 찔러봤다. 나머지 7개
  # (postgres17·GlitchTip 4·promtail·node-exporter)는 죽어도 지표가 없었다.
  # cAdvisor 가 docker 소켓을 읽어 12개 전부를 container_last_seen 등으로 낸다.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    environment:
      # Docker 29 는 API 1.44 미만을 거부한다. 클라이언트 기본값(1.41)을 올린다.
      DOCKER_API_VERSION: "1.44"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
      - '--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp'
    restart: unless-stopped
    networks:
      - monitoring

  # ── postgres-exporter — 운영 DB 내부 지표 (2026-08-28) ──
  # 접속 수·트랜잭션·캐시 적중·용량·락. 읽기 전용 롤 exporter(pg_monitor) 로 붙는다.
  # DSN 은 .env 의 PG_EXPORTER_DSN (git 에 올리지 말 것). postgres17 은 다른 compose 라
  # 그쪽 네트워크(postgres17_default)에 external 로 같이 들어간다.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN}
    command:
      # PG17 은 pg_stat_bgwriter 컬럼이 pg_stat_checkpointer 로 옮겨가 이 수집기가 매번 실패 로그를 낸다
      - '--no-collector.stat_bgwriter'
    restart: unless-stopped
    networks:
      - monitoring
      - postgres17

volumes:
  promtail-positions:
  alertmanager-data:
  glitchtip-pg:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
  postgres17:
    external: true
    name: postgres17_default