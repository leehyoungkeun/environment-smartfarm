# PostgreSQL + TimescaleDB — smartfarm 주 데이터베이스
#
# 2026-08-26 신설. 그전까지 서버의 컨테이너 12개 중 이것 하나만 compose 없이
# 손으로 띄운 상태였다. 지우면 무엇으로 되살릴지가 어디에도 없었다.
#
# 같은 작업에서 포트를 0.0.0.0 → 127.0.0.1 로 좁혔다.
#   사무실 LAN 과 테일넷 어디서나 5432 에 닿을 수 있었고 ssl=off 라 평문이었다.
#   점검 결과 실제 접속자는 호스트 백엔드(localhost) 하나뿐이라 영향이 없다.
#
# ⚠ container_name 은 반드시 postgres17 로 유지할 것.
#   /usr/local/bin/backup-smartfarm.sh 가 이 이름으로 docker exec 해서 덤프한다.
#   이름이 바뀌면 매일 03시 백업이 조용히 실패한다.

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: postgres17
    restart: unless-stopped

    # POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD — git 에 올리지 말 것
    env_file: .env

    ports:
      # 로컬 전용. 원격에서 붙여야 할 일이 생기면 Tailscale 주소를 명시적으로 추가한다
      # (예: "100.71.181.121:5432:5432"). 0.0.0.0 으로 되돌리지 말 것.
      - "127.0.0.1:5432:5432"

    volumes:
      # 데이터는 전용 파티션(/db, 194GB)에 바인드. 도커 볼륨이 아니다.
      - /db/postgresql/data:/var/lib/postgresql/data

    # 체크포인트가 끝나기 전에 SIGKILL 이 가면 손상 위험이 있다.
    # 기존 운영 지침의 `docker stop -t 60` 과 같은 여유를 compose 에도 박아둔다.
    stop_grace_period: 60s

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
