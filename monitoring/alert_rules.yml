groups:
  # ────────────────────────────────────────────────────────────
  # 2026-08-25 신설.
  # 이 날 하루에 감지 실패 3건이 드러났다 — 전부 로그에는 있었지만 아무도 안 봤다.
  #   · AWS 계정 정지로 MQTT 단절        미탐지 3주
  #   · farm_0006 MQTT 플래핑 32만회     미탐지 3.5개월
  #   · RPi 전원 꺼짐(센서 9일 공백)      미탐지 9일
  # 아래 규칙은 그 셋을 각각 분 단위로 잡는 것이 목적이다.
  # ────────────────────────────────────────────────────────────
  - name: smartfarm-critical
    rules:
      # ① AWS IoT MQTT 단절 — 클라우드 제어 경로 전체가 멈춘다
      - alert: MqttDisconnected
        expr: smartfarm_mqtt_connected == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AWS IoT MQTT 연결 끊김"
          description: "백엔드가 5분 이상 MQTT 브로커에 연결하지 못하고 있습니다. 클라우드 제어와 릴레이 상태 수신이 중단됩니다. 인증서·IoT 정책·AWS 계정 상태를 확인하십시오."

      # ② 센서 수집 중단 — RPi 전원/네트워크/Modbus 장애
      - alert: SensorDataStalled
        expr: smartfarm_sensor_last_seen_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.farm_id }}/{{ $labels.house_id }} 센서 수집 중단"
          description: "마지막 센서 수신 후 {{ $value | humanizeDuration }} 경과했습니다. 정상은 1분 주기입니다. RPi 전원·네트워크·Modbus 연결을 확인하십시오."

      # ③ 릴레이 상태 발행 중단 — MQTT 플래핑/NR 이상
      - alert: RelayStatusStalled
        expr: smartfarm_relay_status_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.farm_id }} 릴레이 상태 수신 중단"
          description: "마지막 릴레이 상태 갱신 후 {{ $value | humanizeDuration }} 경과했습니다. 정상은 30초 주기입니다. Node-RED MQTT 연결(플래핑 포함)을 확인하십시오."

      # ③-2 RPi AWS IoT MQTT 직접 끊김 — RPi 는 살아있는데(HTTP 하트비트) MQTT 만 끊김 (RelayStatusStalled 보다 원인 정밀)
      - alert: RpiMqttDisconnected
        expr: smartfarm_rpi_mqtt_connected == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.farm_id }} RPi MQTT 10분+ 끊김"
          description: "RPi 는 살아있는데(HTTP 하트비트 수신) AWS IoT MQTT 가 10분 넘게 끊겨 있습니다. 클라우드 제어 명령이 도달하지 않습니다(로컬 제어는 정상). 재연결은 자동이므로, 지속 끊김이면 인증서·IoT 정책·AWS 계정 상태를 확인하십시오."

      # ④ 스크레이프 대상 다운 — RPi/백엔드 자체가 응답 없음
      - alert: TargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 응답 없음"
          description: "{{ $labels.instance }} 를 10분 이상 스크레이프하지 못했습니다. role=monitoring 이면 해당 컨테이너(docker ps)를, 아니면 호스트 전원·네트워크·node_exporter 를 확인하십시오."

  - name: smartfarm-resource
    rules:
      # ⑤ 디스크 임박 — 가득 차면 DB·백엔드가 동시에 죽는다
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100 < 15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 루트 디스크 여유 {{ $value | printf \"%.1f\" }}%"
          description: "여유 공간이 15% 미만입니다. 로그·도커 이미지 정리를 검토하십시오."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} 루트 디스크 여유 {{ $value | printf \"%.1f\" }}% — 위험"
          description: "곧 가득 찹니다. DB 쓰기 실패와 서비스 중단이 임박했습니다."

      # ⑥ RPi 과열 — SD카드 수명·스로틀링
      - alert: RpiHighTemperature
        expr: node_hwmon_temp_celsius > 75
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 온도 {{ $value | printf \"%.1f\" }}°C"
          description: "15분 이상 75°C 를 넘고 있습니다. 스로틀링과 SD카드 수명 저하가 우려됩니다."

      # ⑦ 감시에서 빠진 채 돌아가는 농장
      #
      # 농장 상태를 'active' 가 아닌 값으로 바꾸면 그 농장의 감지가 통째로 꺼진다 —
      # 오프라인·임계이탈·장비고장 전부. 그런데 화면 어디에도 그 사실이 표시되지 않는다.
      #
      # 2026-08-26 에 실제로 두 번 일어났다. 실운영 중인 farm_0001 이 목록 조작 중
      # 'maintenance' 로 바뀌어 40분 넘게 감시 밖에 있었고, 대시보드를 만들다 우연히
      # 발견했다. 아무 경고도 없었다.
      #
      # 센서가 들어온다는 건 농장이 돌아간다는 뜻이므로, 그런 농장이 감시 대상이
      # 아니면 그 자체가 이상 신호다. 데이터가 끊긴 농장(운영 중지)은 걸리지 않는다.
      #
      # (2026-08-29) 지표 자체가 status='active' 농장만 내므로 점검중 농장은 여기 걸리지 않는다.
      - alert: FarmUnmonitored
        expr: |
          (smartfarm_sensor_last_seen_seconds < 900)
          unless on(farm_id, house_id)
          (count by (farm_id, house_id) (smartfarm_sensor_value))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.farm_id }} 가 감시 대상에서 빠져 있습니다"
          description: "센서 데이터는 정상 수신되는데 감지 대상이 아닙니다. 농장 상태가 '운전중'이 아닌지 확인하십시오 — 그 상태에서는 오프라인·임계이탈·장비고장 감지가 모두 동작하지 않습니다."

      # ⑧ 데이터베이스 접속 불가
      #
      # 2026-08-27 추가. 그전까지 DB 가 죽으면 **가장 조용했다** —
      # 지표 수집 코드가 조회 실패 시 값을 갱신하지 않아, 마지막 정상값이
      # 그대로 남아 정상으로 보였다. SensorDataStalled 도 발동하지 않았다.
      #
      # 이제 실패 시 값을 지우도록 고쳤는데, **값이 사라지는 것만으로는
      # 알림이 뜨지 않는다**(Prometheus 는 존재하는 시계열을 평가한다).
      # 그래서 "살아 있다"는 양의 신호를 따로 두고 그것이 0 이 되면 발동한다.
      - alert: DatabaseDown
        expr: smartfarm_db_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "백엔드가 데이터베이스에 접속하지 못하고 있습니다"
          description: "2분 이상 PostgreSQL 조회가 실패하고 있습니다. 센서 저장·제어 이력·알림이 모두 멈춥니다. postgres17 컨테이너 상태와 디스크를 확인하십시오."

      # ⑩ 카메라 — 2026-08-28 추가
      #
      # Tapo C200 이 공유기 DHCP(lease 2시간)로 .39→.36 으로 옮겨갔는데 go2rtc.yaml 은 .39 고정.
      # 며칠간 "되다 안 되다" 를 반복했고 아무 지표가 없어 사용자가 화면을 보고 알았다.
      # RPi 의 root cron 프로브(smartfarm-camera-probe.sh)가 매분 ping·RTSP·실제 프레임·
      # ONVIF 탐색 IP 를 node_exporter 텍스트파일로 낸다. 근본 조치는 공유기 DHCP 예약.
      - alert: CameraUnreachable
        expr: smartfarm_camera_frame_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "카메라 영상이 10분째 나오지 않습니다"
          description: "{{ $labels.farm }} go2rtc 가 {{ $labels.cam }} 프레임을 받지 못합니다. ip_match 가 0 이면 카메라 IP 가 바뀐 것(공유기 DHCP 예약 확인), 1 이면 카메라 전원·WiFi 를 확인하십시오."
      - alert: CameraIpDrift
        expr: smartfarm_camera_ip_match == 0 and on(farm, cam) smartfarm_camera_info > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "카메라 IP 가 설정과 다릅니다"
          description: "{{ $labels.farm }} {{ $labels.cam }} — ONVIF 탐색 결과가 go2rtc 설정 IP 와 5분째 다릅니다. 공유기에서 카메라 MAC 의 DHCP 예약을 확인하고 go2rtc.yaml 을 맞추십시오."

      # ⑪ 서버 컨테이너 소실 — 2026-08-28 추가 (cAdvisor)
      #
      # 컨테이너가 죽거나 지워지면 그 시계열이 사라진다. 사라진 것은 규칙으로 못 잡으므로
      # "살아 있는 개수" 로 판단한다. 컨테이너를 추가/제거하면 이 숫자를 함께 고칠 것
      # (현재 13: postgres17, glitchtip×4, prometheus, alertmanager, loki, promtail, grafana,
      #  node-exporter, cadvisor, postgres-exporter).
      # ⑫ DB 접속 포화 — 2026-08-28 추가 (postgres-exporter)
      # max_connections=100. 백엔드 풀이 새거나 잠긴 쿼리가 쌓이면 여기서 먼저 보인다.
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count{datname="smartfarm_db"}) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB 접속이 상한의 {{ $value | humanizePercentage }} 입니다"
          description: "smartfarm_db 접속 수가 max_connections 의 80% 를 5분 넘게 초과합니다. 백엔드 커넥션 풀 누수나 오래 잠긴 트랜잭션을 확인하십시오 (Grafana 서버·컨테이너 → DB 행)."
      - alert: ContainerMissing
        expr: count(container_last_seen{name!=""}) < 13
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "서버 컨테이너가 {{ $value }}개만 살아 있습니다 (정상 13)"
          description: "docker ps 로 어느 컨테이너가 빠졌는지 확인하십시오. Grafana '서버·컨테이너' 대시보드에 상태표가 있습니다."

  - name: smartfarm-meta
    rules:
      # ⑬ 항상 발동하는 생존 신호 — Alertmanager 가 GlitchTip Heartbeat 로 넘긴다 (dead man's switch)
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "감시 체계 생존 신호 (항상 발동, Discord 로 가지 않음)"

      # ⑭ 백업 — 2026-08-28. 그전까지 백업 실패는 로그에만 남았다.
      # afocus cron 프로브가 10분마다 NAS 의 최신 백업 파일 나이·크기를 텍스트파일로 낸다.
      # 스크립트 성공 로그가 아니라 **NAS 에 실제로 있는 파일** 을 본다 (파이프라인 끝).
      - alert: BackupStale
        expr: smartfarm_backup_nas_latest_age_seconds > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "NAS 최신 백업이 {{ $value | humanizeDuration }} 전입니다"
          description: "매일 03:00 UTC 백업이 NAS 에 도착하지 않았습니다. /var/log/smartfarm-backup.log 와 NAS 용량·SSH 키를 확인하십시오."
      - alert: BackupTooSmall
        expr: smartfarm_backup_nas_latest_size_bytes < 1024 * 1024
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "NAS 최신 백업이 {{ $value | humanize1024 }}B 뿐입니다"
          description: "pg_dump 가 부실하게 끝났을 수 있습니다 (정상 5MB 안팎). 복구 테스트(server/postgres17/restore-test.sh)로 확인하십시오."
      - alert: BackupProbeFailed
        expr: smartfarm_backup_probe_ok == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "NAS 백업 확인 자체가 1시간째 실패합니다"
          description: "프로브가 NAS(100.125.93.50)에 SSH 로 닿지 못합니다. Tailscale·NAS 전원·키(~/.ssh/smartgreen_backups)를 확인하십시오. 백업 상태를 모르는 상태입니다."

      # RPi 로컬 데이터 정리가 26시간 넘게 보고를 안 함 = 매일 03:00 작업이 멈췄다.
      # SQLite 가 조용히 무한정 커지다 디스크가 찰 때야 발견되던 것을 조기 감지한다 (2026-08-30).
      - alert: RpiCleanupStalled
        expr: time() - smartfarm_rpi_cleanup_last_run_timestamp > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.farm_id }} 로컬 데이터 정리 멈춤"
          description: "60일 보관 정리가 {{ $value | humanizeDuration }} 째 보고되지 않았습니다(정상은 매일 03:00). NR 「보관기간 적용 삭제」 플로우와 서버 보고 경로를 확인하십시오."

      # 자동제어 엔진(② 규칙 평가)이 3분 넘게 평가를 안 함 = 자동화 정지.
      # 센서는 SensorDataStalled 가 보지만 엔진 루프 정지는 이것만 잡는다 — 측창·환기가 조용히 멈춰
      # 아침에 안 열려도 알림이 없던 사각지대(2026-08-30). 작물 직접 피해라 critical.
      - alert: AutomationEngineStalled
        expr: time() - smartfarm_automation_engine_last_run_timestamp > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.farm_id }} 자동제어 엔진 정지"
          description: "규칙 평가가 {{ $value | humanizeDuration }} 째 돌지 않았습니다(정상 60초 주기). 센서 수집과 무관하게 측창·환기 등 자동화가 멈춘 상태입니다. Node-RED 「시간 기반 평가」·「규칙 평가」 흐름을 즉시 확인하십시오."

      # 제어이력이 15분 넘게 서버로 안 감 = 동기화 밀림(로컬에만 쌓임 → 유실 위험, 1,474건 전례).
      - alert: ControlSyncStalled
        expr: smartfarm_control_unsynced_oldest_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.farm_id }} 제어이력 동기화 밀림"
          description: "가장 오래된 미전송 제어이력이 {{ $value | humanizeDuration }} 째 서버로 못 갔습니다. 로컬에만 쌓이면 이미지 재설치·SD 교체 시 유실됩니다. NR 「제어이력 동기화」와 서버 수신 경로를 확인하십시오."

      # 제어이력 동기화 상태 보고 자체가 20분 넘게 끊김 = inject·NR 정지.
      - alert: ControlSyncReportMissing
        expr: time() - smartfarm_control_sync_last_report_timestamp > 1200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.farm_id }} 제어이력 동기화 보고 끊김"
          description: "5분 주기 동기화 상태 보고가 {{ $value | humanizeDuration }} 째 없습니다. NR 「5분 간격 제어이력 동기화」 inject 가 멈췄을 수 있습니다."

      # 배포 cron(5분)이 20분 넘게 안 돎 = 배포 자동화 정지(git push 해도 반영 안 됨, 조용함).
      - alert: DeployCronStalled
        expr: time() - smartfarm_deploy_last_run_timestamp > 1200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "배포 자동화(cron) 정지"
          description: "smartfarm-deploy 가 {{ $value | humanizeDuration }} 째 돌지 않았습니다(정상 5분 주기). git push 해도 서버에 반영되지 않는 상태입니다. cron·스크립트를 확인하십시오."

      # 마지막 배포가 실패(rollback)로 끝남.
      - alert: DeployFailed
        expr: smartfarm_deploy_last_ok == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "배포 실패 — rollback 됨"
          description: "마지막 smartfarm-deploy 가 health 실패로 롤백됐습니다. deploy.log 와 커밋을 점검하십시오."
