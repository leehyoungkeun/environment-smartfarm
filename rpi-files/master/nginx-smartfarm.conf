server {
    listen 80 default_server;
    server_name _;

    root /home/lhk/smartfarm-frontend;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ──────────────────────────────────────────────────────────────
    # Node-RED (1880) — 로컬 API 본체
    #
    # 무인증 키오스크(127.0.0.1)가 쓰는 유일한 경로다. rpi-server(3001) 는
    # routes/index.js 의 router.use(authenticate) 로 전부 잠겨 있어 토큰 없이는 401 이고,
    # 실제 센서 이력(2개월)도 ~/.node-red/smartfarm.db 에 있다.
    #
    # ⚠ X-Real-IP 를 반드시 넘긴다.
    #   settings.js 의 httpNodeMiddleware 는 '소켓이 루프백이고 X-Real-IP 가 없거나 루프백일 때'만
    #   무인증 통과시킨다. 헤더를 안 넘기면 nginx 소켓만 보고 LAN 요청까지 키오스크로 오인한다.
    #   실제로 2026-08-30 점검에서 /api/local/·/api/sync/ 가 LAN 에서 200 으로 열려 있었다.
    # ──────────────────────────────────────────────────────────────
    location /api/local/            { proxy_pass http://localhost:1880/api/local/;            proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/sync/             { proxy_pass http://localhost:1880/api/sync/;             proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/control/local     { proxy_pass http://localhost:1880/api/control/local;     proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/control/status/   { proxy_pass http://localhost:1880/api/control/status/;   proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/sensors/          { proxy_pass http://localhost:1880/api/sensors/;          proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/alerts/           { proxy_pass http://localhost:1880/api/alerts/;           proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/automation/       { proxy_pass http://localhost:1880/api/automation/;       proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/config/           { proxy_pass http://localhost:1880/api/config/;           proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/relay/            { proxy_pass http://localhost:1880/api/relay/;            proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/ks3267/           { proxy_pass http://localhost:1880/api/ks3267/;           proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/watchdog/         { proxy_pass http://localhost:1880/api/watchdog/;         proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/device-positions  { proxy_pass http://localhost:1880/api/device-positions;  proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # 시스템 API (system-api.js, 3100) — 농장 ID·setup·system status
    location /api/system/ {
        proxy_pass http://localhost:3100/api/system/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 초기 설정 페이지 (system-api.js 의 /setup)
    location /setup {
        proxy_pass http://localhost:3100/setup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (server.js, 3001)
    location /ws {
        proxy_pass http://localhost:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # smartfarm-rpi server.js (3001) — 위에서 안 잡힌 /api/* (auth·programs·alarms·status 등)
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Node-RED 에디터
    location /node-red {
        proxy_pass http://localhost:1880/node-red;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
