# → /etc/systemd/journald.conf.d/50-smartfarm-persistent.conf
# Raspberry Pi OS 는 /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf 로 저널을
# 휘발성으로 강제한다(SD 보호). 2026-08-28 원인 불명 재부팅 뒤 이전 부팅 로그가 없어
# 원인 추적이 불가능했다. /etc 가 /usr/lib 을 덮으므로 여기서 영속으로 되돌리고,
# SD 마모는 용량 상한으로 막는다. 적용 후: systemctl restart systemd-journald && journalctl --flush
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
