# 주의: proxy_pass 대상은 반드시 **127.0.0.1** — `localhost` 금지.
#   `localhost` 는 IPv4(127.0.0.1)·IPv6(::1) 두 주소로 풀리는데 Node-RED 는 IPv4 로만 듣는 구성이 있어
#   nginx 가 ::1 을 고르면 전 경로가 502 가 된다 (2026-09-13 키오스크 먹통 사고: 클라우드 지표는 전부
#   초록인데 패널의 제어·설정만 통째로 실패). IP 를 박아 이름 해석 자체를 없앤다.
server {
    listen 80 default_server;
    server_name _;

    root /home/lhk/smartfarm-frontend;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 시스템 API (system-api.js, port 3100) — 농장 ID·setup·system status
    # WiFi 설정은 «패널 앞에 있는 사람»만 — 키오스크 브라우저는 http://localhost 라 nginx 에 127.0.0.1 로 온다.
    # 같은 농장 LAN 의 다른 기기가 무선을 바꿔 제어기를 고립시키는 일을 막는다 (2026-09-13).
    location /api/system/wifi {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3100/api/system/wifi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/system/ {
        proxy_pass http://127.0.0.1:3100/api/system/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 초기 설정 페이지 (system-api.js 의 /setup)
    location /setup {
        proxy_pass http://127.0.0.1:3100/setup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Node-RED — healthcheck (/api/local/*) + config sync (/api/sync/*)
    location /api/local/ {
        proxy_pass http://127.0.0.1:1880/api/local/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/sync/ {
        proxy_pass http://127.0.0.1:1880/api/sync/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Node-RED — 로컬 직접 제어 (트랩 22 fix, 2026-05-09)
    # frontend farm-local 모드 RPi 직접 제어 (rest_api_flow 핸들러)
    # longest-prefix-match: /api/control/local (17) > /api/ (5) → Node-RED 우선
    location /api/control/local {
        proxy_pass http://127.0.0.1:1880/api/control/local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (server.js, port 3001)
    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # smartfarm-rpi server.js (port 3001) — auth·sensors·control·programs·alarms·users 등
    # 위에서 매칭 안 된 /api/* 전부 server.js 로 (Node-RED는 /api/local/·/api/sync/ 만)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Node-RED 에디터
    location /node-red {
        proxy_pass http://127.0.0.1:1880/node-red;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
