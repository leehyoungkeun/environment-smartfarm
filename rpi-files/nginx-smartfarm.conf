server {
    listen 80 default_server;
    server_name _;

    root /home/lhk/smartfarm-frontend;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 시스템 API (system-api.js, port 3100) — 농장 ID·setup·system status
    location /api/system/ {
        proxy_pass http://localhost:3100/api/system/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 초기 설정 페이지 (system-api.js 의 /setup)
    location /setup {
        proxy_pass http://localhost:3100/setup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Node-RED — healthcheck (/api/local/*) + config sync (/api/sync/*)
    location /api/local/ {
        proxy_pass http://localhost:1880/api/local/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/sync/ {
        proxy_pass http://localhost:1880/api/sync/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket (server.js, port 3001)
    location /ws {
        proxy_pass http://localhost:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # smartfarm-rpi server.js (port 3001) — auth·sensors·control·programs·alarms·users 등
    # 위에서 매칭 안 된 /api/* 전부 server.js 로 (Node-RED는 /api/local/·/api/sync/ 만)
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Node-RED 에디터
    location /node-red {
        proxy_pass http://localhost:1880/node-red;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
