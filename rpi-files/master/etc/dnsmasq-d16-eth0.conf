# /etc/dnsmasq.d/d16-eth0.conf — D16 전광판 전용 DHCP (이더넷만)
#
# bind-dynamic 인 이유 (2026-09-14)
#   예전엔 bind-interfaces 였다. 그건 시작 시점에 eth0 이 없으면 그대로 죽는다.
#   전광판 랜선이 빠져 있던 농장에서 "unknown interface eth0" 로 매 부팅 실패했고,
#   실패 유닛이 쌓여 진짜 장애를 볼 때 눈을 흐렸다.
#   bind-dynamic 은 없는 인터페이스를 참고 기다렸다가 생기면 그때 붙는다.
#   전광판을 쓰는 농장에서 랜선을 잠깐 뽑아도 서비스가 죽지 않는다.
#
# 전광판을 쓰지 않는 농장에서는 이 파일이 남아 있어도 상관없다.
# smartfarm-d16-net off 가 dnsmasq 자체를 정지·자동시작 해제하기 때문이다.
# 랜포트를 농장 공유기에 꽂아도 169.254 주소를 뿌리지 않는다.
interface=eth0
bind-dynamic
except-interface=wlan0
except-interface=lo
except-interface=tailscale0
no-dhcp-interface=wlan0
no-dhcp-interface=lo
no-dhcp-interface=tailscale0
dhcp-range=169.254.100.10,169.254.100.100,255.255.0.0,12h
dhcp-host=48:22:fd:02:37:90,169.254.255.254,d16-display,infinite
port=0
log-dhcp
log-facility=/var/log/dnsmasq-d16.log
